<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
</head>
<body>
  <form>
    <table border="1" cellpadding="5" cellspacing="0">
      <tr><th colspan="2">Registration Form</th></tr>
      
      <tr>
        <td>Username:</td>
        <td><input type="text" name="username" required></td>
      </tr>

      <tr>
        <td>Password:</td>
        <td><input type="password" name="password" required></td>
      </tr>

      <tr>
        <td>Email:</td>
        <td><input type="email" name="email" required></td>
      </tr>

      <tr>
        <td>Date of Birth:</td>
        <td><input type="date" name="dob"></td>
      </tr>

      <tr>
        <td>Gender:</td>
        <td>
          <input type="radio" name="gender" value="male"> Male
          <input type="radio" name="gender" value="female"> Female
          <input type="radio" name="gender" value="other"> Other
        </td>
      </tr>

      <tr>
        <td>Interests:</td>
        <td>
          <input type="checkbox" name="int" value="sports"> Sports
          <input type="checkbox" name="int" value="music"> Music
          <input type="checkbox" name="int" value="reading"> Reading
          <input type="checkbox" name="int" value="traveling"> Traveling
        </td>
      </tr>

      <tr>
        <td>Country:</td>
        <td>
          <select name="country">
            <option>--Select--</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Canada</option>
            <option>Australia</option>
          </select>
        </td>
      </tr>

      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="Register">
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
